name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deploy potřebuje id-token (OIDC) + pages write; contents read na checkout.
permissions:
  contents: read
  pages: write
  id-token: write

# Rozdělaný deploy se nechá doběhnout, čekající se zahazují — poslední push vyhrává.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Project site běží na /<repo>/, ne v rootu — bez toho by všechny
          # /images/ a /fonts/ cesty ukazovaly mimo web.
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}
        # npm run build = assets + assets:latent + og + astro build; deriváty
        # (public/images/**, src/data/images.json, …) nejsou v gitu, staví se tady.
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
